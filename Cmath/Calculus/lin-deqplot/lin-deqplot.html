<script id="cskeytyped" type="text/x-cindyscript">
//Script (CindyScript)
if(key()=="?" % keydownlist()==[32],
  if(!isreal(NumTyped),NumTyped=0);
  if(NumTyped==0,
    DispStr=
     "Figure(1) Parent(2) Parapara(3) Movie(4) Surf(5)";
  );
  if(NumTyped==1,
    DispStr=
     "Shift+ Title(T) Para(P) Slide(S) Digest(D)";
  );
  if(NumTyped==2,
    DispStr="Shift+ Meshlab(M)";
  );
  if(NumTyped==3,
    DispStr=
     "Ch : disp(0) chg(9) N(+,-) add(<) rmv(>)";
  );
  drawtext(mouse().xy,DispStr,size->24);
  NumTyped=mod(NumTyped+1,4);
,
  NumTyped=0;  
);
if(key()=="1",//Mkfigure
  Viewtex();
  kc();
);
if(key()=="2",//Mkparent
  Viewparent();
);
if(key()=="3",//Flipbook(Parapara)
  Flipbook();
);
if(key()=="4",//Texmovie
  Texmovie();
  kc();
);
if(key()=="5",//Surface
  Cheader();
  Cmain();
  kcC();
  if(ChNum>0,
    Ch=[ChNum];
  ,
    Ch=[1];
  );
  ChNum=0;
);
if(key()=="T",//Title
  Maketitle();
);
if(key()=="P",//ParaF
  Parafolder();
);
if(key()=="S",//Slide 
  Mkslides();
);
if(key()=="D",//Digest(Summary)
  Mkslidesummary();
);
if(key()=="M",//Meshlab
  Mkviewobj(OCNAME,OBJCMD,OCOPTION);
);

if(key()=="0",
  Dispchoice();
);
if(key()=="9",
  if(length(Ch)==0,
    Ch=[ChNum];
  ,
    if(!contains(Ch,ChNum),
      Ch=append(Ch,ChNum);
      ChNum=Ch_(length(Ch)-1);
      Ch=remove(Ch,[ChNum]);
      Ch=sort(Ch);
    );
  );
  Dispchoice();
);
if(key()=="+",
  ChNum=ChNum+1;
  Dispchoice();
);
if(key()=="-",
  ChNum=ChNum-1;
  Dispchoice();
);
if(key()=="<",
  if(length(select(Ch,#==ChNum))==0,
    Ch=append(Ch,ChNum);
    Ch=sort(Ch);
    ChNum=ChNum+1;
  );
  Dispchoice();
);
if(key()=="^",
  if(length(Ch)==0,
    Ch=[ChNum];
  ,
    if(!contains(Ch,ChNum),
      Ch=Ch_(1..(length(Ch)-1));
      Ch=append(Ch,ChNum);
      Ch=sort(Ch);
    );
  );
  ChNum=ChNum+1;
  Dispchoice();
);
if(key()=="~",
  if(length(Ch)==0,
    Ch=[ChNum];
  ,
    if(!contains(Ch,ChNum),
      Ch=Ch_(1..(length(Ch)-1));
      Ch=append(Ch,ChNum);
      Ch=sort(Ch);
    );
  );
  ChNum=max(ChNum-1,1);
  Dispchoice();
);
if(key()==">",
  if(length(Ch)>0,
    ChNum=Ch_(length(Ch));
    Ch=Remove(Ch,[ChNum]);
  );
  Dispchoice();
);

;

</script>
<script id="csdraw" type="text/x-cindyscript">
//figures
Ketinit(1.5);

Setketcindyjs(["Sc=1.2","Color=offwhite"]);
Setwindow([-0.5,10],[-5.5,5.5]);
Setscaling(0.1);
Setax(["","t","","x","","",""]);
//Addax(0);

/////////////// キーボード入力 //////////////
nameL1=[["BS","AC","<",">",">>"]];
Keytable(5,11.6,1,9,[8,5.1],[0,1,0],nameL1,[0,-0.2],20);
nameL2=Keyname();
Keytable(5,11.6,5,9,[8,0.58],[1,1,0],nameL2,[0,-0.2],20);

if(funflg==1,
  if(contains(Manifun,name),
    parse(name+";");
  ,
    tmp=indexof(Str,"?");
    if(tmp>0,npos=tmp,npos=length(Str));
    out=Addfunstr(name,npos,Str);
    tmp=length(out_1)-length(Str);
    npos=npos+tmp;
    Str=out_1; //npos=out_2;
    if(npos<length(Str),
      tmp=replace(Str,"?","");
      tmp1=substring(tmp,0,npos-1)+"?";
      Str=tmp1+substring(tmp,npos-1,length(tmp));
    );
  );
  Subsedit(0,Str);
  funflg=0;
  stflg=0;
);

Strnq=Textedit(0,"","");
if(Strnq!=Strnow,
  Strnow=Strnq;
);

Rstr=Strnq;
Rtexstr=Totexform(Rstr);
Rcdystr=Tocindyform(Rstr);

///////////// 解曲線 ///////////////
Setscaling(1);
Slider("C1",[-2,-5],[-2,5]);
Expr([-2,YMAX],"n","x(0)");
inspect(C1,"ptsize","5.1");
Expr(C1.xy,"w3",format(C1.y,2));
Slider("C2",[-1,-5],[-1,5]);
Expr([-1,YMAX],"n","\dfrac{dx}{dt}(0)");
inspect(C2,"ptsize","5.1");
Expr(C2.xy,"w3",format(C2.y,2));
Slider("B",[-3,6],[5,6]);
Letter([5,6],"e","$x$の係数");
inspect(B,"ptsize","5.1");
Expr(B.xy,"n3",format(B.x,0));

aa=-2; bb=parse(format(B.x,0));
if(length(Rstr)>0,
  rr=replace(Rcdystr,"t","x");
  eq1="y''=-aa*y'-bb*y+"+rr;
  eq1=Assign(eq1,["aa",aa,"bb",bb]);

  Setscaling(1/60);
  Deqplot("1",eq1,"x=[0,XMAX]",0,[C1.y,C2.y],["Num=1000"]);

  Htickmark([5,"5",10,"10"]);
  Vtickmark([-5*60,"-300",5*60,"300"]);
);

////////////// 微分方程式の表示 /////////////
Setscaling(1);
Letter([-3,9],"e","定数係数線形微分方程式",["Size=1.5"]);
Expreq(eq):=(
  regional(str);
  str=eq;
  str=replace(str,"x","t");
  str=replace(str,"y''","\frac{d^{2}x}{dt^2}");
  str=replace(str,"y'","\frac{dx}{dt}");
  str=replace(str,"y","x");
  str=replace(str,"*","");
  str=replace(str,"(","");
  str=replace(str,")","");
  str=replace(str,"+-","-");
  str=replace(str,"-1","-");
  str=replace(str,"+0x","");
  str=replace(str,"+1x","+x");
  str="\displaystyle "+str;
  str;
);
if(length(Rstr)>0,
  eq2="y''+aa*y'+bb*y=";
  eq2=Assign(eq2,["aa",aa,"bb",bb]);
  str0=Expreq(eq2)+Rtexstr;
  Expr([[3,7.8],"e",str0],["size->20"]);
);
str1="x(0)="+format(C1.y,2);
Expr([[-3,7.8],"e",str1],["size->20"]);
str2="\dfrac{dx}{dt}(0)="+format(C2.y,2);
Expr([[-0.5,7.8],"e",str2],["size->20"]);

Windispg();
//Help("Deq");


;

</script>
